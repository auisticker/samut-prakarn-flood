<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบเช็คเส้นทางน้ำท่วมและถนนชำรุด สมุทรปราการ (Real-time)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet CSS (แผนที่ฟรี) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map { height: calc(100vh - 65px); width: 100%; }
    </style>
</head>
<body class="flex flex-col h-screen bg-gray-100">

    <!-- Header -->
    <header class="bg-blue-600 text-white p-4 shadow-md flex justify-between items-center z-10">
        <h1 class="text-base sm:text-lg font-bold">🌊 สมุทรปราการ: เช็คจุดน้ำท่วม & ถนนชำรุด</h1>
        <button onclick="openReportModal()" class="bg-red-500 hover:bg-red-600 text-white px-3 py-1.5 rounded-lg text-sm font-semibold shadow">
            + แจ้งเหตุ
        </button>
    </header>

    <!-- Main Map -->
    <main class="flex-1 relative">
        <div id="map"></div>
    </main>

    <!-- Modal ฟอร์มรายงาน -->
    <div id="reportModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex justify-center items-center z-50 p-4">
        <div class="bg-white rounded-lg p-6 w-full max-w-md shadow-xl">
            <h2 class="text-xl font-bold mb-4 text-gray-800">รายงานจุดน้ำท่วม / ถนนชำรุด</h2>
            <form id="reportForm" onsubmit="submitReport(event)">
                <div class="mb-4">
                    <label class="block text-gray-700 text-sm font-bold mb-2">ประเภทปัญหา:</label>
                    <select id="reportType" class="w-full border rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="flood">💧 น้ำท่วมขัง / น้ำท่วมสูง</option>
                        <option value="broken_road">🚧 ถนนชำรุด / เป็นหลุมเป็นบ่อ</option>
                    </select>
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 text-sm font-bold mb-2">รายละเอียดเพิ่มเติม:</label>
                    <textarea id="reportDetail" rows="3" class="w-full border rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="เช่น ซอยสุขุมวิท 10 น้ำท่วมสูง 30 ซม."></textarea>
                </div>
                <p class="text-xs text-gray-500 mb-4">* ระบบจะใช้พิกัดจากจุดที่คุณคลิกบนแผนที่ล่าสุด</p>
                <div class="flex justify-end space-x-2">
                    <button type="button" onclick="closeReportModal()" class="bg-gray-300 hover:bg-gray-400 text-gray-800 px-4 py-2 rounded-lg text-sm">ยกเลิก</button>
                    <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm">บันทึกรายงาน</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // ตั้งค่าแผนที่เริ่มต้นที่จังหวัดสมุทรปราการ
        const map = L.map('map').setView([13.5990, 100.6067], 12);

        // โหลดแผนที่ OpenStreetMap พื้นฐาน
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        let selectedLatLng = null;
        let tempMarker = null;

        // คลิกลงบนแผนที่เพื่อเลือกจุดแจ้งเรื่อง
        map.on('click', function(e) {
            selectedLatLng = e.latlng;
            
            // ลบหมุดชั่วคราวก่อนหน้าถ้ามี
            if (tempMarker) {
                map.removeLayer(tempMarker);
            }

            // ปักหมุดชั่วคราวให้ผู้ใช้รู้ว่าเลือกจุดไหน
            tempMarker = L.marker([selectedLatLng.lat, selectedLatLng.lng]).addTo(map)
                .bindPopup("จุดที่คุณเลือกรายงาน").openPopup();

            openReportModal();
        });

        function openReportModal() {
            document.getElementById("reportModal").classList.remove("hidden");
        }

        function closeReportModal() {
            document.getElementById("reportModal").classList.add("hidden");
        }

        function submitReport(event) {
            event.preventDefault();
            const type = document.getElementById("reportType").value;
            const detail = document.getElementById("reportDetail").value;

            if (!selectedLatLng) {
                alert("กรุณาคลิกเลือกตำแหน่งบนแผนที่ก่อนครับ");
                return;
            }

            const newReport = {
                lat: selectedLatLng.lat,
                lng: selectedLatLng.lng,
                type: type,
                detail: detail,
                time: new Date().toLocaleTimeString()
            };

            // บันทึกและแสดงผลลงแผนที่ทันที (สามารถเปลี่ยนไปต่อ Firebase ได้ทีหลัง)
            addMarkerToMap(newReport);

            alert("บันทึกรายงานเรียบร้อยแล้ว!");
            closeReportModal();
            document.getElementById("reportForm").reset();
        }

        function addMarkerToMap(data) {
            let colorText = data.type === 'flood' ? '💧 น้ำท่วมขัง' : '🚧 ถนนชำรุด';
            let badgeColor = data.type === 'flood' ? 'text-blue-600' : 'text-orange-600';

            L.marker([data.lat, data.lng]).addTo(map)
                .bindPopup(`
                    <div style="font-family: sans-serif;">
                        <strong class="${badgeColor}">${colorText}</strong><br>
                        <p>${data.detail}</p>
                        <small style="color: gray;">เวลา: ${data.time}</small>
                    </div>
                `);
        }

        // ข้อมูลตัวอย่างเริ่มต้นในสมุทรปราการ
        const mockData = [
            { lat: 13.5992, lng: 100.6060, type: 'flood', detail: 'น้ำท่วมขังรอการระบาย หน้าศาลากลาง', time: '10:00' },
            { lat: 13.6150, lng: 100.5900, type: 'broken_road', detail: 'ถนนเป็นหลุมใหญ่ เลนซ้ายชำรุด', time: '09:30' }
        ];

        mockData.forEach(data => addMarkerToMap(data));
    </script>
</body>
</html>
